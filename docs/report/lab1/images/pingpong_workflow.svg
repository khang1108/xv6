<svg xmlns="http://www.w3.org/2000/svg" width="760" height="996"  viewBox="0 0 760 996" role="img" aria-labelledby="svg-title svg-description">
<title id="svg-title">Workflow của pingpong.c trong xv6</title>
<desc id="svg-description">pingpong tạo hai pipe riêng cho hai chiều, fork tiến trình con, cha gửi một byte qua p2c, con in ping rồi gửi lại qua c2p, cha in pong, wait và kiểm tra mã thoát của con.</desc>
<defs>
<style>
text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
.t { font-size: 14px; fill: #2c2c2a; }
.ts { font-size: 12px; fill: #5f5e5a; }
.th { font-size: 14px; font-weight: 600; fill: #2c2c2a; }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace !important; font-size: 12px; fill: #2c2c2a; white-space: pre; }
.box { fill: #F1EFE8; stroke: #B4B2A9; }
.arr { stroke: #5f5e5a; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.kicker { font-size: 11px; font-weight: 600; letter-spacing: .07em; fill: #888780; }
.lane { fill: none; stroke: #B4B2A9; stroke-width: 1; stroke-dasharray: 4 4; }
.guide { stroke: #B4B2A9; stroke-width: 1; fill: none; stroke-dasharray: 4 4; }
.teal-arr { stroke: #0F6E56; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.c-purple > rect { fill: #EEEDFE; stroke: #534AB7; }
.c-purple > .th { fill: #3C3489; }
.c-purple > .ts { fill: #534AB7; }
.c-teal > rect, .c-teal > circle { fill: #E1F5EE; stroke: #0F6E56; }
.c-teal > .th { fill: #085041; }
.c-teal > .ts { fill: #0F6E56; }
</style>
</defs>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<symbol id="folder" viewBox="0 0 24 20"><path d="M1.5 3.5h8l2 2.5h11v12h-21z" fill="#F1EFE8" stroke="#5f5e5a" stroke-width="1.4" stroke-linejoin="round"/></symbol>
<symbol id="file" viewBox="0 0 18 22"><path d="M1.5 1.5h9l6 6v13h-15z M10.5 1.5v6h6" fill="#F1EFE8" stroke="#5f5e5a" stroke-width="1.4" stroke-linejoin="round"/></symbol>
</defs>
<rect class="box" x="30" y="44" width="190" height="89" rx="8" stroke-width=".7" />
<circle cx="43" cy="58" r="3" fill="#888780"/>
<circle cx="54" cy="58" r="3" fill="#888780"/>
<circle cx="65" cy="58" r="3" fill="#888780"/>
<text class="mono" x="42" y="85">$ pingpong</text>
<text class="mono" x="42" y="102">không cần đối số</text><line x1="220" y1="88" x2="248" y2="88" class="arr" marker-end="url(#arrow)"/><g class="c-purple">
<rect class="box" x="250" y="44" width="250" height="89" rx="8" stroke-width=".7" />
<text class="th" x="262" y="66">1.  Tạo 2 pipe</text>
<text class="ts" x="262" y="86">parent_to_child[2] (p2c)</text>
<text class="ts" x="262" y="103">child_to_parent[2] (c2p)</text>
</g><line x1="500" y1="88" x2="528" y2="88" class="arr" marker-end="url(#arrow)"/><g class="c-purple">
<rect class="box" x="530" y="44" width="200" height="89" rx="8" stroke-width=".7" />
<text class="th" x="542" y="66">2.  fork()</text>
<text class="ts" x="542" y="86">pid == 0: con</text>
<text class="ts" x="542" y="103">pid &gt; 0: cha</text>
</g><path d="M630 133 V159 H573 V181" class="arr" marker-end="url(#arrow)"/><path d="M573 159 H184 V181" class="arr" marker-end="url(#arrow)"/><text class="kicker" x="30" y="207">TIẾN TRÌNH CHA (pid &gt; 0)</text><text class="kicker" x="430" y="207">TIẾN TRÌNH CON (pid == 0)</text><rect x="30" y="218" width="317" height="556" rx="12" class="lane"/><rect x="413" y="218" width="317" height="556" rx="12" class="lane"/><g class="c-purple">
<rect class="box" x="45" y="237" width="287" height="78" rx="8" stroke-width=".7" />
<text class="th" x="57" y="259">3.  Đóng đầu không dùng</text>
<text class="ts" x="57" y="279">close(p2c[0]) · close(c2p[1])</text>
</g><g class="c-purple">
<rect class="box" x="428" y="237" width="287" height="78" rx="8" stroke-width=".7" />
<text class="th" x="440" y="259">3.  Đóng đầu không dùng</text>
<text class="ts" x="440" y="279">close(p2c[1]) · close(c2p[0])</text>
</g><line x1="188" y1="315" x2="188" y2="343" class="arr" marker-end="url(#arrow)"/><line x1="572" y1="315" x2="572" y2="343" class="arr" marker-end="url(#arrow)"/><g class="c-purple">
<rect class="box" x="45" y="345" width="287" height="79" rx="8" stroke-width=".7" />
<text class="th" x="57" y="367">4.  write(p2c[1], &amp;byte, 1)</text>
<text class="ts" x="57" y="387">gửi byte &quot;p&quot; cho con</text>
<text class="ts" x="57" y="404">đóng p2c[1] sau khi ghi</text>
</g><g class="c-teal">
<rect class="box" x="428" y="345" width="287" height="79" rx="8" stroke-width=".7" />
<text class="th" x="440" y="367">4.  read(p2c[0], &amp;byte, 1)</text>
<text class="ts" x="440" y="387">đọc đúng 1 byte từ cha</text>
<text class="ts" x="440" y="404">đóng p2c[0] sau khi đọc</text>
</g><line x1="332" y1="384" x2="426" y2="384" class="teal-arr" marker-end="url(#arrow)"/><g class="c-teal"><rect class="box" x="346" y="350" width="67" height="28" rx="14" stroke-width=".6" /><text class="ts" x="379.5" y="364" text-anchor="middle" dominant-baseline="central">p2c →</text></g><line x1="572" y1="424" x2="572" y2="451" class="arr" marker-end="url(#arrow)"/><g class="c-teal">
<rect class="box" x="428" y="454" width="287" height="62" rx="8" stroke-width=".7" />
<text class="th" x="440" y="476">5.  In kết quả ở con</text>
<text class="ts" x="440" y="496">printf(&quot;%d: received ping&quot;)</text>
</g><line x1="572" y1="516" x2="572" y2="533" class="arr" marker-end="url(#arrow)"/><g class="c-purple">
<rect class="box" x="45" y="535" width="287" height="91" rx="8" stroke-width=".7" />
<text class="th" x="57" y="557">6.  read(c2p[0], …)</text>
<text class="ts" x="57" y="577">chờ byte phản hồi từ con</text>
<text class="ts" x="57" y="594">đóng c2p[0] sau khi đọc</text>
</g><g class="c-teal">
<rect class="box" x="428" y="535" width="287" height="91" rx="8" stroke-width=".7" />
<text class="th" x="440" y="557">6.  write(c2p[1], …)</text>
<text class="ts" x="440" y="577">gửi lại byte vừa nhận</text>
<text class="ts" x="440" y="594">đóng c2p[1]; exit(0)</text>
</g><line x1="428" y1="577" x2="334" y2="577" class="teal-arr" marker-end="url(#arrow)"/><g class="c-teal"><rect class="box" x="346" y="542" width="67" height="28" rx="14" stroke-width=".6" /><text class="ts" x="379.5" y="556" text-anchor="middle" dominant-baseline="central">← c2p</text></g><line x1="188" y1="626" x2="188" y2="652" class="arr" marker-end="url(#arrow)"/><g class="c-teal">
<rect class="box" x="45" y="654" width="287" height="74" rx="8" stroke-width=".7" />
<text class="th" x="57" y="676">7.  In kết quả ở cha</text>
<text class="ts" x="57" y="696">nhận 1 byte → &quot;received pong&quot;</text>
</g><line x1="188" y1="728" x2="188" y2="739" class="arr" marker-end="url(#arrow)"/><g><rect class="box" x="54" y="740" width="271" height="28" rx="14" stroke-width=".6" /><text class="ts" x="189.5" y="754" text-anchor="middle" dominant-baseline="central">wait(&amp;status_child) → thu hồi con</text></g><g class="c-teal"><rect class="box" x="437" y="663" width="269" height="28" rx="14" stroke-width=".6" /><text class="ts" x="571.5" y="677" text-anchor="middle" dominant-baseline="central">con: exit(0) sau khi gửi</text></g><text class="kicker" x="30" y="808">HAI CHIỀU TRUYỀN DỮ LIỆU</text><rect class="box" x="30" y="822" width="356" height="112" rx="8" stroke-width=".7" />
<circle cx="43" cy="836" r="3" fill="#888780"/>
<circle cx="54" cy="836" r="3" fill="#888780"/>
<circle cx="65" cy="836" r="3" fill="#888780"/>
<text class="mono" x="42" y="863">$ pingpong</text>
<text class="mono" x="42" y="880">PID_con: received ping</text>
<text class="mono" x="42" y="897">PID_cha: received pong</text><g class="c-purple">
<rect class="box" x="408" y="822" width="322" height="112" rx="8" stroke-width=".7" />
<text class="th" x="420" y="844">Điều kiện thành công</text>
<text class="ts" x="420" y="864">cha nhận được 1 byte</text>
<text class="ts" x="420" y="881">wait() thành công</text>
<text class="ts" x="420" y="898">status_child == 0 → exit(0)</text>
</g><rect class="box" x="30" y="960" width="16" height="16" rx="3" stroke-width=".8" style="fill:#EEEDFE;stroke:#534AB7"/>
<text class="ts" x="54" y="969" dominant-baseline="central">Bước xử lý</text>
<rect class="box" x="174" y="960" width="16" height="16" rx="3" stroke-width=".8" style="fill:#E1F5EE;stroke:#0F6E56"/>
<text class="ts" x="198" y="969" dominant-baseline="central">Dữ liệu / kết quả</text>
<rect class="box" x="370" y="960" width="16" height="16" rx="3" stroke-width=".8" stroke-dasharray="3 2"/>
<text class="ts" x="394" y="969" dominant-baseline="central">Điều kiện / ghi chú</text>
</svg>