<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline sàng nguyên tố trong xv6</title>
<style>
:root{
  --bg:#ffffff; --p:#2c2c2a; --s:#5f5e5a; --t:#888780;
  --surface:#F1EFE8; --border:#B4B2A9;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1c1c1a; --p:#F1EFE8; --s:#B4B2A9; --t:#888780; --surface:#2c2c2a; --border:#5F5E5A; }
}
html,body{margin:0;background:var(--bg);}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--p);padding:24px 16px;}
figure{max-width:900px;margin:0 auto;}
svg{width:100%;height:auto;display:block;}
figcaption{font-size:14px;color:var(--s);margin-top:12px;line-height:1.6;}
svg text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
.t{font-size:14px;fill:var(--p);}
.ts{font-size:12px;fill:var(--s);}
.th{font-size:14px;font-weight:500;fill:var(--p);}
.box{fill:var(--surface);stroke:var(--border);}
.arr{stroke:var(--s);stroke-width:1.5;fill:none;stroke-linecap:round;}

.c-purple > rect{fill:#EEEDFE;stroke:#534AB7;}
.c-purple > .th{fill:#3C3489;}
.c-purple > .ts{fill:#534AB7;}
.c-teal > rect,.c-teal > circle{fill:#E1F5EE;stroke:#0F6E56;}
.c-teal > .th{fill:#085041;}
.c-teal > .ts{fill:#0F6E56;}
@media (prefers-color-scheme: dark){
  .c-purple > rect{fill:#3C3489;stroke:#AFA9EC;}
  .c-purple > .th{fill:#CECBF6;}
  .c-purple > .ts{fill:#AFA9EC;}
  .c-teal > rect,.c-teal > circle{fill:#085041;stroke:#5DCAA5;}
  .c-teal > .th{fill:#9FE1CB;}
  .c-teal > .ts{fill:#5DCAA5;}
}
</style>
</head>
<body>
<figure>
<svg viewBox="0 0 680 380" role="img">
<title>Pipeline sàng nguyên tố đồng thời trong xv6</title>
<desc>Process main sinh các số từ 2 đến 280 vào pipe. Mỗi tầng filter đọc số đầu tiên làm số nguyên tố p, in ra, rồi lọc bỏ bội của p và chuyển phần còn lại sang tầng con thông qua pipe mới.</desc>
<defs>

<rect x="118" y="122" width="70" height="26" rx="13" fill="none" stroke="var(--border)" stroke-width="1"/>

<text class="ts" x="30" y="304" text-anchor="start">cha</text>
<text class="ts" x="578" y="304" text-anchor="start">con …</text>

<g class="c-teal"><circle cx="46" cy="352" r="8" stroke-width="0.8"/></g>
<text class="ts" x="62" y="352" dominant-baseline="central">Số nguyên tố p</text>
<circle class="box" cx="226" cy="352" r="8" stroke-width="0.5"/>

<text class="ts" x="442" y="352" dominant-baseline="central">Bội của p, bị loại</text>
</svg>
<figcaption>Hình: Pipeline sàng nguyên tố đồng thời (<code>primes.c</code>, xv6). Mỗi tầng <code>filter</code> đọc số đầu tiên làm <code>p</code>, in ra, loại bội của <code>p</code> và chuyển phần còn lại sang tiến trình con qua pipe mới.</figcaption>
</figure>
</body>
</html>
