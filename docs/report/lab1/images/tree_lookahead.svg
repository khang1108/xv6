<svg class="p" viewBox="0 0 960 430" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      *{box-sizing:border-box}
      .p text{font-family:"Latin Modern Roman",Cambria,Georgia,"Times New Roman",serif;fill:#1a1a1a}
      .p .pnl{font-size:12px;font-style:italic;fill:#5b4a72;font-weight:600}
      .p .box{font-size:11.5px}
      .p .sub{font-size:9px;fill:#6b7280}
      .p .lbl{font-size:9.5px}
      .p .key{font-size:10px}
      .p .w{fill:none;stroke:#2b2b2b;stroke-width:1.1;marker-end:url(#mk)}
      .p .w-dash{fill:none;stroke:#2b2b2b;stroke-width:1.1;stroke-dasharray:3 3;marker-end:url(#mk)}
      .p .r{fill:none;stroke:#8b1a1a;stroke-width:1.2;marker-end:url(#mkr)}
      .p .g{fill:none;stroke:#2d5236;stroke-width:1.1;marker-end:url(#mkg)}
    </style>
    <marker id="mk" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1.5 L6.5 4 L1 6.5 z" fill="#2b2b2b"/>
    </marker>
    <marker id="mkr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1.5 L6.5 4 L1 6.5 z" fill="#8b1a1a"/>
    </marker>
    <marker id="mkg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1.5 L6.5 4 L1 6.5 z" fill="#2d5236"/>
    </marker>
  </defs>

  <!-- BACKGROUND CONTAINER -->
  <rect x="12" y="10" width="936" height="405" rx="10" fill="#fdfdfe" stroke="#c3aedb" stroke-width="1.1"/>
  <text class="pnl" x="28" y="30">Cơ chế duyệt DFS và Kỹ thuật đệm 1 phần tử (Lookahead Buffer) — (tree.c)</text>

  <!-- ================= TOP LEFT: XV6 DIRECTORY STREAM ================= -->
  <rect x="28" y="52" width="165" height="180" rx="8" fill="#eaf0fb" stroke="#7f93b8" stroke-width="1.2"/>
  <text class="box" x="110" y="74" text-anchor="middle" font-weight="bold" fill="#1e3a6a">Directory Stream</text>
  <text class="sub" x="110" y="88" text-anchor="middle">Đọc tuần tự từ Inode thư mục</text>
  <line x1="38" y1="96" x2="183" y2="96" stroke="#7f93b8" stroke-width="0.6" stroke-dasharray="2 2"/>

  <!-- Stream entries -->
  <rect x="38" y="104" width="145" height="24" rx="4" fill="#ffffff" stroke="#7f93b8" stroke-width="0.7"/>
  <text class="lbl" x="48" y="119" fill="#1e3a6a">1. Entry A: "README"</text>
  
  <rect x="38" y="133" width="145" height="24" rx="4" fill="#ffffff" stroke="#7f93b8" stroke-width="0.7"/>
  <text class="lbl" x="48" y="148" fill="#1e3a6a">2. Entry B: "cat"</text>

  <rect x="38" y="162" width="145" height="24" rx="4" fill="#ffffff" stroke="#7f93b8" stroke-width="0.7"/>
  <text class="lbl" x="48" y="177" fill="#1e3a6a">3. Entry C: "echo" (Cuối)</text>

  <text class="sub" x="110" y="202" text-anchor="middle" fill="#8b1a1a">Lọc: inum != 0 và tên != "." / ".."</text>
  <text class="sub" x="110" y="217" text-anchor="middle" fill="#4b5563">Gặp EOF khi read() == 0</text>

  <!-- ARROW TO BUFFER -->
  <path class="w" d="M193,142 H245"/>
  <rect x="198" y="125" width="42" height="16" rx="3" fill="#ffffff" stroke="#5f8a6b" stroke-width="0.7"/>
  <text class="sub" x="219" y="136" text-anchor="middle" font-weight="bold" fill="#2d5236">read(de)</text>

  <!-- ================= TOP CENTER: 1-ITEM LOOKAHEAD BUFFER ================= -->
  <rect x="245" y="52" width="235" height="180" rx="8" fill="#e3f0e6" stroke="#5f8a6b" stroke-width="1.2"/>
  <text class="box" x="362" y="74" text-anchor="middle" font-weight="bold" fill="#2d5236">Kỹ thuật Lookahead Buffer</text>
  <text class="sub" x="362" y="88" text-anchor="middle">Chỉ duy trì 1 biến đệm (O(1) Memory)</text>
  <line x1="255" y1="96" x2="470" y2="96" stroke="#5f8a6b" stroke-width="0.6" stroke-dasharray="2 2"/>

  <!-- Buffer State Box -->
  <rect x="257" y="104" width="211" height="65" rx="6" fill="#ffffff" stroke="#5f8a6b" stroke-width="0.9"/>
  <text class="lbl" x="267" y="122" font-weight="bold" fill="#1e3a24">Trạng thái bộ đệm:</text>
  <text class="lbl" x="277" y="140" fill="#2d5236">• <tspan font-style="italic">prev_de:</tspan> Lưu trữ mục đọc trước đó</text>
  <text class="lbl" x="277" y="157" fill="#2d5236">• <tspan font-style="italic">has_prev:</tspan> Cờ báo hiệu có phần tử đệm</text>

  <rect x="257" y="176" width="211" height="46" rx="4" fill="#d0e6d5" stroke="#5f8a6b" stroke-width="0.7"/>
  <text class="sub" x="267" y="191" fill="#1e3a24">Đọc mục mới → In mục cũ (dạng |--)</text>
  <text class="sub" x="267" y="206" fill="#1e3a24">Hết file (EOF) → In mục cũ (dạng └──)</text>

  <!-- ARROW TO PRINTER -->
  <path class="w" d="M480,142 H532"/>
  <rect x="486" y="125" width="40" height="16" rx="3" fill="#ffffff" stroke="#c08484" stroke-width="0.7"/>
  <text class="sub" x="506" y="136" text-anchor="middle" font-weight="bold" fill="#8b1a1a">format</text>

  <!-- ================= TOP RIGHT: VISUAL BRANCH RENDERING ================= -->
  <rect x="532" y="52" width="400" height="180" rx="8" fill="#fdf6d5" stroke="#c9b043" stroke-width="1.2"/>
  <text class="box" x="732" y="74" text-anchor="middle" font-weight="bold" fill="#7a6200">Định dạng hiển thị cây thư mục</text>
  <text class="sub" x="732" y="88" text-anchor="middle">Tự động phân biệt nhánh giữa và nhánh kết thúc</text>
  <line x1="542" y1="96" x2="922" y2="96" stroke="#c9b043" stroke-width="0.6" stroke-dasharray="2 2"/>

  <!-- Trace simulation -->
  <rect x="546" y="104" width="372" height="118" rx="6" fill="#ffffff" stroke="#c9b043" stroke-width="0.8"/>
  
  <text class="lbl" x="558" y="124" fill="#4b5563">Khi đọc B ("cat"):</text>
  <text class="lbl" x="668" y="124" font-weight="bold" fill="#1a1a1a">In prev_de (A) dạng: </text>
  <text class="lbl" x="790" y="124" font-weight="bold" fill="#2d5236">|-- README</text>

  <line x1="558" y1="134" x2="906" y2="134" stroke="#e5e7eb" stroke-width="0.6"/>

  <text class="lbl" x="558" y="152" fill="#4b5563">Khi đọc C ("echo"):</text>
  <text class="lbl" x="668" y="152" font-weight="bold" fill="#1a1a1a">In prev_de (B) dạng: </text>
  <text class="lbl" x="790" y="152" font-weight="bold" fill="#2d5236">|-- cat</text>

  <line x1="558" y1="162" x2="906" y2="162" stroke="#e5e7eb" stroke-width="0.6"/>

  <text class="lbl" x="558" y="180" fill="#8b1a1a">Gặp EOF (hết file):</text>
  <text class="lbl" x="668" y="180" font-weight="bold" fill="#8b1a1a">In prev_de (C) dạng: </text>
  <text class="lbl" x="790" y="180" font-weight="bold" fill="#8b1a1a">└── echo</text>
  
  <text class="sub" x="732" y="208" text-anchor="middle" fill="#6b7280">Nếu là thư mục (T_DIR) → Đệ quy tăng level + 1</text>

  <!-- ================= BOTTOM SECTION: 3 KEY TECHNICAL HIGHLIGHTS ================= -->
  <line x1="28" y1="248" x2="932" y2="248" stroke="#c3aedb" stroke-width="0.8" stroke-dasharray="4 3"/>

  <!-- CARD 1: MEMORY OPTIMIZATION -->
  <rect x="28" y="265" width="288" height="135" rx="8" fill="#e3f0e6" stroke="#5f8a6b" stroke-width="1.1"/>
  <text class="box" x="172" y="288" text-anchor="middle" font-weight="bold" fill="#2d5236">1. Tối ưu bộ nhớ: O(1) RAM</text>
  <line x1="40" y1="296" x2="304" y2="296" stroke="#5f8a6b" stroke-width="0.5"/>
  <text class="lbl" x="42" y="316" fill="#1f2937">• Không cấp phát mảng/vector để lưu trước thư mục.</text>
  <text class="lbl" x="42" y="334" fill="#1f2937">• Bộ nhớ xv6 rất nhỏ; nạp cả thư mục dễ gây tràn heap.</text>
  <text class="lbl" x="42" y="352" fill="#2d5236">• <tspan font-weight="bold">Giải pháp:</tspan> Cơ chế Lookahead chỉ tốn đúng kích thước</text>
  <text class="lbl" x="42" y="370" fill="#2d5236">  của 1 struct dirent trên stack để định dạng cây.</text>

  <!-- CARD 2: RECURSION SAFETY -->
  <rect x="336" y="265" width="288" height="135" rx="8" fill="#fadcdc" stroke="#c08484" stroke-width="1.1"/>
  <text class="box" x="480" y="288" text-anchor="middle" font-weight="bold" fill="#8b1a1a">2. Chống lặp đệ quy &amp; Inode rác</text>
  <line x1="348" y1="296" x2="612" y2="296" stroke="#c08484" stroke-width="0.5"/>
  <text class="lbl" x="350" y="316" fill="#1f2937">• Hệ thống tệp xv6 luôn có hai mục "." và "..".</text>
  <text class="lbl" x="350" y="334" fill="#1f2937">• File bị xóa vẫn còn ô trống với `inum == 0`.</text>
  <text class="lbl" x="350" y="352" fill="#8b1a1a">• <tspan font-weight="bold">Giải pháp:</tspan> Lọc bỏ tường minh `inum == 0`, "." và ".."</text>
  <text class="lbl" x="350" y="370" fill="#8b1a1a">  để tránh đệ quy lặp vô hạn làm sập stack kernel.</text>

  <!-- CARD 3: DEPTH & FILTER PRUNING -->
  <rect x="644" y="265" width="288" height="135" rx="8" fill="#eaf0fb" stroke="#7f93b8" stroke-width="1.1"/>
  <text class="box" x="788" y="288" text-anchor="middle" font-weight="bold" fill="#1e3a6a">3. Cắt tỉa sâu (-L) &amp; Lọc thư mục (-d)</text>
  <line x1="656" y1="296" x2="920" y2="296" stroke="#7f93b8" stroke-width="0.5"/>
  <text class="lbl" x="658" y="316" fill="#1f2937">• Kiểm tra độ dài: `strlen(path) + DIRSIZ + 1 &lt;= PATHSIZ`.</text>
  <text class="lbl" x="658" y="334" fill="#1f2937">• Tùy chọn `-L depth`: Cắt tỉa ngay đầu hàm nếu `level &gt;= depth`.</text>
  <text class="lbl" x="658" y="352" fill="#1e3a6a">• <tspan font-weight="bold">Tùy chọn -d:</tspan> Dùng `stat()` lọc chỉ hiển thị `T_DIR`,</text>
  <text class="lbl" x="658" y="370" fill="#1e3a6a">  tiết kiệm tối đa số lần gọi hệ thống `open()` và `read()`.</text>

</svg>
