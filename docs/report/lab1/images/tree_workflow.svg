<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640"  viewBox="0 0 760 640" role="img">
<title>Workflow của tree.c trong xv6</title>
<desc>main đọc tham số rồi gọi tree. Mỗi lần gọi tree mở đường dẫn, nếu là thư mục thì đọc từng dirent, lọc, gom vào mảng children động, in cây với tiền tố từ ancestor_has_next và đệ quy vào thư mục con.</desc>
<defs>
<style>
text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
.t { font-size: 14px; fill: #2c2c2a; }
.ts { font-size: 12px; fill: #5f5e5a; }
.th { font-size: 14px; font-weight: 600; fill: #2c2c2a; }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace !important; font-size: 12px; fill: #2c2c2a; white-space: pre; }
.box { fill: #F1EFE8; stroke: #B4B2A9; }
.arr { stroke: #5f5e5a; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.kicker { font-size: 11px; font-weight: 600; letter-spacing: .07em; fill: #888780; }
.lane { fill: none; stroke: #B4B2A9; stroke-width: 1; stroke-dasharray: 4 4; }
.guide { stroke: #B4B2A9; stroke-width: 1; fill: none; stroke-dasharray: 4 4; }
.teal-arr { stroke: #0F6E56; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.c-purple > rect { fill: #EEEDFE; stroke: #534AB7; }
.c-purple > .th { fill: #3C3489; }
.c-purple > .ts { fill: #534AB7; }
.c-teal > rect, .c-teal > circle { fill: #E1F5EE; stroke: #0F6E56; }
.c-teal > .th { fill: #085041; }
.c-teal > .ts { fill: #0F6E56; }
</style>
</defs>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<symbol id="folder" viewBox="0 0 24 20"><path d="M1.5 3.5h8l2 2.5h11v12h-21z" fill="#F1EFE8" stroke="#5f5e5a" stroke-width="1.4" stroke-linejoin="round"/></symbol>
<symbol id="file" viewBox="0 0 18 22"><path d="M1.5 1.5h9l6 6v13h-15z M10.5 1.5v6h6" fill="#F1EFE8" stroke="#5f5e5a" stroke-width="1.4" stroke-linejoin="round"/></symbol>
</defs>

<!-- ============ (a) main() ============ -->
<rect class="box" x="30" y="44" width="190" height="72" rx="8" stroke-width="0.5"/>
<circle cx="42" cy="56" r="3" fill="#888780"/><circle cx="53" cy="56" r="3" fill="#888780"/><circle cx="64" cy="56" r="3" fill="#888780"/>
<text class="ts" x="42" y="84">$ tree xv6 -L 2 -d</text>
<text class="ts" x="42" y="100">path=xv6 · depth=2 · d=1</text>

<line x1="220" y1="80" x2="248" y2="80" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
<rect x="250" y="44" width="250" height="72" rx="8" stroke-width="0.5"/>
<text class="th" x="262" y="60">main() đọc tham số</text>
<text class="ts" x="262" y="108">parse(): chỉ nhận chữ số, chống tràn</text>
</g>
<rect class="box" x="262" y="70" width="70" height="22" rx="5" stroke-width="0.5"/><text class="ts" x="297" y="81" text-anchor="middle" dominant-baseline="central">-d</text>
<rect class="box" x="340" y="70" width="70" height="22" rx="5" stroke-width="0.5"/><text class="ts" x="375" y="81" text-anchor="middle" dominant-baseline="central">-L n</text>
<rect class="box" x="418" y="70" width="70" height="22" rx="5" stroke-width="0.5"/><text class="ts" x="453" y="81" text-anchor="middle" dominant-baseline="central">[path]</text>

<line x1="500" y1="80" x2="528" y2="80" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
<rect x="530" y="44" width="200" height="72" rx="8" stroke-width="0.5"/>
<text class="th" x="542" y="60">tree()</text>
<text class="ts" x="542" y="76">level = 0 · max_depth = depth</text>
<text class="ts" x="542" y="91">only_dir = d</text>
<text class="ts" x="542" y="106">ancestor_has_next[128] = {0}</text>
</g>

<path d="M630 116 V130 H86 V162" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="730" y="152" text-anchor="end">bên trong tree(): mỗi lần gọi xử lý một thư mục</text>

<!-- ============ (b) ============ -->
<!-- S1 -->
<g class="c-purple">
<rect x="30" y="164" width="112" height="136" rx="8" stroke-width="0.5"/>
<text class="th" x="42" y="182">1.  Mở path</text>
<text class="ts" x="42" y="204">open + fstat</text>
<text class="ts" x="42" y="220">level 0: in gốc</text>
<text class="ts" x="42" y="244">chạm max_depth</text>
<text class="ts" x="42" y="260">→ return</text>
</g>

<line x1="142" y1="212" x2="160" y2="212" class="arr" marker-end="url(#arrow)"/>

<!-- decision -->
<polygon points="196,178 230,212 196,246 162,212" class="box" stroke-width="0.8" stroke-linejoin="round"/>
<text class="ts" x="196" y="212" text-anchor="middle" dominant-baseline="central">type?</text>
<line x1="230" y1="212" x2="250" y2="212" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="241" y="228" text-anchor="middle">DIR</text>
<line x1="196" y1="246" x2="196" y2="320" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="204" y="284">FILE / DEV</text>

<!-- return pill -->
<rect class="box" x="136" y="324" width="120" height="24" rx="12" stroke-width="0.5"/>
<text class="ts" x="196" y="336" text-anchor="middle" dominant-baseline="central">close(fd) · return</text>
<path d="M86 300 V336 H134" class="arr" marker-end="url(#arrow)"/>

<!-- S2 -->
<g class="c-purple">
<rect x="252" y="164" width="204" height="136" rx="8" stroke-width="0.5"/>
<text class="th" x="264" y="182">2.  read() từng dirent</text>
<text class="ts" x="264" y="262">thêm '\0' vào name (DIRSIZ = 14)</text>
<text class="ts" x="264" y="278">stat(buf) lỗi → status = -1</text>
<text class="ts" x="264" y="294">only_dir &amp;&amp; !T_DIR → bỏ</text>
</g>
<rect class="box" x="261" y="194" width="34" height="26" rx="4" stroke-width="0.8" stroke-dasharray="3 2"/><text class="ts" x="278" y="207" text-anchor="middle" dominant-baseline="central">0</text>
<rect class="box" x="299" y="194" width="34" height="26" rx="4" stroke-width="0.8" stroke-dasharray="3 2"/><text class="ts" x="316" y="207" text-anchor="middle" dominant-baseline="central">.</text>
<rect class="box" x="337" y="194" width="34" height="26" rx="4" stroke-width="0.8" stroke-dasharray="3 2"/><text class="ts" x="354" y="207" text-anchor="middle" dominant-baseline="central">..</text>
<rect class="box" x="375" y="194" width="34" height="26" rx="4" stroke-width="1.2"/><text class="th" x="392" y="207" text-anchor="middle" dominant-baseline="central">src</text>
<rect class="box" x="413" y="194" width="34" height="26" rx="4" stroke-width="1.2"/><text class="th" x="430" y="207" text-anchor="middle" dominant-baseline="central">a.c</text>
<text class="ts" x="261" y="240">bỏ: inum=0, ., ..</text>
<text class="ts" x="411" y="240" text-anchor="middle">giữ</text>

<line x1="456" y1="212" x2="494" y2="212" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="475" y="200" text-anchor="middle">stat()</text>

<!-- S3 children[] -->
<rect class="box" x="496" y="164" width="234" height="136" rx="8" stroke-width="0.5"/>
<text class="th" x="508" y="182">3.  children[ ] (mảng động)</text>

<g class="c-teal">
<rect x="518" y="194" width="22" height="30" rx="3" stroke-width="0.8"/>
<rect x="542" y="194" width="22" height="30" rx="3" stroke-width="0.8"/>
<rect x="566" y="194" width="22" height="30" rx="3" stroke-width="0.8"/>
<rect x="590" y="194" width="22" height="30" rx="3" stroke-width="0.8"/>
<rect x="614" y="194" width="22" height="30" rx="3" stroke-width="0.8"/>
</g>
<rect class="box" x="638" y="194" width="22" height="30" rx="3" stroke-width="0.8" stroke-dasharray="3 2"/>
<rect class="box" x="662" y="194" width="22" height="30" rx="3" stroke-width="0.8" stroke-dasharray="3 2"/>
<rect class="box" x="686" y="194" width="22" height="30" rx="3" stroke-width="0.8" stroke-dasharray="3 2"/>
<use href="#folder" x="520" y="202" width="18" height="15"/>
<use href="#file" x="547" y="202" width="12" height="15"/>
<use href="#folder" x="568" y="202" width="18" height="15"/>
<use href="#file" x="595" y="202" width="12" height="15"/>
<use href="#file" x="619" y="202" width="12" height="15"/>

<line x1="613" y1="228" x2="613" y2="248" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="621" y="242">đầy → capacity × 2</text>

<g class="c-teal">
<rect x="518" y="252" width="11" height="18" rx="2" stroke-width="0.8"/>
<rect x="530" y="252" width="11" height="18" rx="2" stroke-width="0.8"/>
<rect x="542" y="252" width="11" height="18" rx="2" stroke-width="0.8"/>
<rect x="554" y="252" width="11" height="18" rx="2" stroke-width="0.8"/>
<rect x="566" y="252" width="11" height="18" rx="2" stroke-width="0.8"/>
<rect x="578" y="252" width="11" height="18" rx="2" stroke-width="0.8"/>
<rect x="590" y="252" width="11" height="18" rx="2" stroke-width="0.8"/>
<rect x="602" y="252" width="11" height="18" rx="2" stroke-width="0.8"/>
</g>
<rect class="box" x="614" y="252" width="11" height="18" rx="2" stroke-width="0.8" stroke-dasharray="3 2"/>
<rect class="box" x="626" y="252" width="11" height="18" rx="2" stroke-width="0.8" stroke-dasharray="3 2"/>
<rect class="box" x="638" y="252" width="11" height="18" rx="2" stroke-width="0.8" stroke-dasharray="3 2"/>
<rect class="box" x="650" y="252" width="11" height="18" rx="2" stroke-width="0.8" stroke-dasharray="3 2"/>
<rect class="box" x="662" y="252" width="11" height="18" rx="2" stroke-width="0.8" stroke-dasharray="3 2"/>
<rect class="box" x="674" y="252" width="11" height="18" rx="2" stroke-width="0.8" stroke-dasharray="3 2"/>
<rect class="box" x="686" y="252" width="11" height="18" rx="2" stroke-width="0.8" stroke-dasharray="3 2"/>
<rect class="box" x="698" y="252" width="11" height="18" rx="2" stroke-width="0.8" stroke-dasharray="3 2"/>
<text class="ts" x="508" y="288">struct child { name[15]; is_dir }</text>

<!-- S3 -> (c) -->
<path d="M613 300 V360 H130 V388" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="400" y="354">close(fd) rồi duyệt mảng</text>

<!-- ============ (c) ============ -->
<g class="c-purple">
<rect x="30" y="392" width="200" height="148" rx="8" stroke-width="0.5"/>
<text class="th" x="42" y="410">4.  Lặp i = 0 … count-1</text>
<text class="ts" x="42" y="432">tiền tố cho mỗi lv &lt; level:</text>
<text class="ts" x="42" y="448" style="white-space:pre">has_next ? "│   " : "    "</text>
<text class="ts" x="42" y="472">rồi in ├── (giữa) hoặc</text>
<text class="ts" x="42" y="488">└── (mục cuối) + tên</text>
<text class="ts" x="42" y="510">là thư mục &amp; chưa chạm max:</text>
<text class="ts" x="42" y="526">→ tree(buf, level+1, …)</text>
</g>

<line x1="230" y1="466" x2="260" y2="466" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal">
<rect x="262" y="392" width="220" height="148" rx="8" stroke-width="0.5"/>
</g>
<circle cx="276" cy="404" r="3" fill="#888780"/><circle cx="287" cy="404" r="3" fill="#888780"/><circle cx="298" cy="404" r="3" fill="#888780"/>
<text class="mono" x="276" y="424">$ tree xv6 -L 2</text>
<text class="mono" x="276" y="442">xv6</text>
<text class="mono" x="276" y="458">├── kernel</text>
<text class="mono" x="276" y="474">│   ├── fs.c</text>
<text class="mono" x="276" y="490">│   └── proc.c</text>
<text class="mono" x="276" y="506">└── user</text>
<text class="mono" x="276" y="522">    └── ls.c</text>

<line x1="514" y1="466" x2="484" y2="466" class="arr" marker-end="url(#arrow)"/>

<rect class="box" x="514" y="392" width="216" height="148" rx="8" stroke-width="0.5"/>
<text class="th" x="526" y="410">ancestor_has_next[ ]</text>
<text class="ts" x="526" y="434">con của kernel (còn user)</text>
<g class="c-teal"><rect x="526" y="442" width="28" height="24" rx="4" stroke-width="0.8"/><text class="th" x="540" y="454" text-anchor="middle" dominant-baseline="central">1</text></g>
<text class="ts" x="564" y="454" dominant-baseline="central" style="white-space:pre">→ "│   " (đường dọc)</text>
<text class="ts" x="526" y="490">con của user (mục cuối)</text>
<rect class="box" x="526" y="498" width="28" height="24" rx="4" stroke-width="0.8" stroke-dasharray="3 2"/><text class="ts" x="540" y="510" text-anchor="middle" dominant-baseline="central">0</text>
<text class="ts" x="564" y="510" dominant-baseline="central">→ 4 dấu cách</text>

<!-- recursion loop -->
<path d="M30 470 H20 V232 H29" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="13" y="350" text-anchor="middle" transform="rotate(-90 13 350)">đệ quy: tree(buf, level+1)</text>

<!-- end -->
<line x1="130" y1="540" x2="130" y2="554" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="30" y="556" width="230" height="26" rx="13" stroke-width="0.5"/>
<text class="ts" x="145" y="569" text-anchor="middle" dominant-baseline="central">free(children) · return status</text>
<line x1="260" y1="569" x2="298" y2="569" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="300" y="556" width="230" height="26" rx="13" stroke-width="0.5"/>
<text class="ts" x="415" y="569" text-anchor="middle" dominant-baseline="central">main: exit(status &lt; 0 ? 1 : 0)</text>

<!-- legend -->
<g class="c-purple"><rect x="30" y="602" width="16" height="16" rx="3" stroke-width="0.8"/></g>
<text class="ts" x="54" y="610" dominant-baseline="central">Bước xử lý</text>
<g class="c-teal"><rect x="170" y="602" width="16" height="16" rx="3" stroke-width="0.8"/></g>
<text class="ts" x="194" y="610" dominant-baseline="central">Dữ liệu / kết quả</text>
<rect class="box" x="350" y="602" width="16" height="16" rx="3" stroke-width="0.8" stroke-dasharray="3 2"/>
<text class="ts" x="374" y="610" dominant-baseline="central">Bị bỏ qua / chưa dùng</text>
</svg>