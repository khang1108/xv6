<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workflow của diff.c trong xv6</title>
<style>
:root{
  --bg:#ffffff; --p:#2c2c2a; --s:#5f5e5a; --t:#888780;
  --surface:#F1EFE8; --border:#B4B2A9;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1c1c1a; --p:#F1EFE8; --s:#B4B2A9; --t:#888780; --surface:#2c2c2a; --border:#5F5E5A; }
}
html,body{margin:0;background:var(--bg);}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--p);padding:24px 16px;}
figure{max-width:960px;margin:0 auto;}
svg{width:100%;height:auto;display:block;}
figcaption{font-size:14px;color:var(--s);margin-top:12px;line-height:1.6;}
svg text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
.t{font-size:14px;fill:var(--p);}
.ts{font-size:12px;fill:var(--s);}
.th{font-size:14px;font-weight:600;fill:var(--p);}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace !important;font-size:12px;fill:var(--p);white-space:pre;}
.box{fill:var(--surface);stroke:var(--border);}
.arr{stroke:var(--s);stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round;}

.c-purple > rect{fill:#EEEDFE;stroke:#534AB7;}
.c-purple > .th{fill:#3C3489;}
.c-purple > .ts{fill:#534AB7;}
.c-teal > rect,.c-teal > circle{fill:#E1F5EE;stroke:#0F6E56;}
.c-teal > .th{fill:#085041;}
.c-teal > .ts{fill:#0F6E56;}
@media (prefers-color-scheme: dark){
  .c-purple > rect{fill:#3C3489;stroke:#AFA9EC;}
  .c-purple > .th{fill:#CECBF6;}
  .c-purple > .ts{fill:#AFA9EC;}
  .c-teal > rect,.c-teal > circle{fill:#085041;stroke:#5DCAA5;}
  .c-teal > .th{fill:#9FE1CB;}
  .c-teal > .ts{fill:#5DCAA5;}
}
</style>
</head>
<body>
<figure>
<svg viewBox="0 0 760 640" role="img" aria-labelledby="svg-title svg-description">
<title id="svg-title">Workflow của diff.c trong xv6</title>
<desc id="svg-description">main mở hai tệp chỉ đọc rồi gọi readline trên mỗi tệp, so sánh nội dung theo từng dòng với bộ đệm tự co giãn trên heap; -q dừng ngay tại khác biệt đầu tiên; mặc định in từng dòng khác, EOF và cảnh báo thiếu newline.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<!-- ============ (a) main() & Khởi tạo ============ -->
<rect class="box" x="30" y="44" width="190" height="72" rx="8" stroke-width="0.5"/>
<circle cx="42" cy="56" r="3" fill="var(--t)"/><circle cx="53" cy="56" r="3" fill="var(--t)"/><circle cx="64" cy="56" r="3" fill="var(--t)"/>
<text class="mono" x="42" y="82">$ diff a.txt b.txt</text>
<text class="ts" x="42" y="99">tùy chọn: -q · đối số: f1, f2</text>

<line x1="220" y1="80" x2="248" y2="80" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
<rect x="250" y="44" width="250" height="72" rx="8" stroke-width="0.5"/>
<text class="th" x="262" y="60">main() đọc tham số</text>
<text class="ts" x="262" y="106">thiếu / thừa tệp → exit(2)</text>
</g>
<rect class="box" x="262" y="68" width="65" height="22" rx="4" stroke-width="0.5"/><text class="ts" x="294" y="79" text-anchor="middle" dominant-baseline="central">file1</text>
<rect class="box" x="333" y="68" width="65" height="22" rx="4" stroke-width="0.5"/><text class="ts" x="365" y="79" text-anchor="middle" dominant-baseline="central">file2</text>
<rect class="box" x="404" y="68" width="86" height="22" rx="4" stroke-width="0.5"/><text class="ts" x="447" y="79" text-anchor="middle" dominant-baseline="central">-q (quiet)</text>

<line x1="500" y1="80" x2="528" y2="80" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
<rect x="530" y="44" width="200" height="72" rx="8" stroke-width="0.5"/>
<text class="th" x="542" y="60">1.  open() &amp; fstat()</text>
<text class="ts" x="542" y="77">mở fd1, fd2: O_RDONLY</text>
<text class="ts" x="542" y="92">bắt buộc st.type == T_FILE</text>
<text class="ts" x="542" y="107">sai loại / lỗi → exit(2)</text>
</g>

<path d="M630 116 V134 H86 V162" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="730" y="150" text-anchor="end">bên trong while(1): đọc từng dòng và cấp phát đệm động</text>

<!-- ============ (b) readline() & Dynamic Buffer ============ -->
<g class="c-purple">
<rect x="30" y="164" width="200" height="136" rx="8" stroke-width="0.5"/>
<text class="th" x="42" y="184">2.  readline(fd1) &amp; (fd2)</text>
<text class="ts" x="42" y="206">đọc byte: read(fd, &amp;c, 1)</text>
<text class="ts" x="42" y="224">dừng khi gặp '\n' hoặc EOF</text>
<text class="ts" x="42" y="244">lưu cờ has_newline (0 hay 1)</text>
<text class="ts" x="42" y="264">len &gt; 0: dòng · 0: EOF · -1: lỗi</text>
<text class="ts" x="42" y="284">lỗi → diff_found = 2, break</text>
</g>

<line x1="230" y1="232" x2="258" y2="232" class="arr" marker-end="url(#arrow)"/>

<rect class="box" x="260" y="164" width="260" height="136" rx="8" stroke-width="0.5"/>
<text class="th" x="272" y="184">3.  Bộ đệm động (Dynamic Buffer)</text>

<g class="c-teal">
<rect x="272" y="196" width="90" height="24" rx="4" stroke-width="0.8"/>
<text class="ts" x="317" y="208" text-anchor="middle" dominant-baseline="central">cap = 128 B</text>
</g>
<text class="ts" x="372" y="208" dominant-baseline="central">sức chứa ban đầu</text>

<line x1="317" y1="222" x2="317" y2="238" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="325" y="230" dominant-baseline="central">khi len + 1 ≥ cap</text>

<g class="c-teal">
<rect x="272" y="240" width="155" height="24" rx="4" stroke-width="0.8"/>
<text class="ts" x="349" y="252" text-anchor="middle" dominant-baseline="central">cap × 2 (256 B, 512 B …)</text>
</g>
<text class="ts" x="272" y="284">malloc() mới · memmove() · free(cũ)</text>

<line x1="520" y1="232" x2="548" y2="232" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
<rect x="550" y="164" width="180" height="136" rx="8" stroke-width="0.5"/>
<text class="th" x="562" y="184">Kiểm tra EOF &amp; Dừng</text>
</g>
<rect class="box" x="562" y="198" width="156" height="34" rx="5" stroke-width="0.8" stroke-dasharray="3 2"/>
<text class="ts" x="640" y="209" text-anchor="middle" dominant-baseline="central">len1 == 0 &amp;&amp; len2 == 0</text>
<text class="th" x="640" y="223" text-anchor="middle" dominant-baseline="central">→ Cả hai xong: break</text>
<text class="ts" x="562" y="254">Một bên hết trước:</text>
<text class="ts" x="562" y="270">gán con trỏ dòng đó = 0</text>
<text class="ts" x="562" y="286">bên kia tiếp tục đọc dữ liệu</text>

<path d="M640 300 V346 H130 V374" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="400" y="340">so khớp nội dung và xuất kết quả phân kỳ</text>

<!-- ============ (c) So sánh & Xuất kết quả ============ -->
<g class="c-purple">
<rect x="30" y="374" width="210" height="148" rx="8" stroke-width="0.5"/>
<text class="th" x="42" y="394">4.  So khớp từng dòng</text>
<text class="ts" x="42" y="416">Khác biệt (is_diff = 1) nếu:</text>
<text class="ts" x="42" y="434">len1 ≠ len2 hoặc has_nl1 ≠ has_nl2</text>
<text class="ts" x="42" y="452">hoặc strcmp(buf1, buf2) ≠ 0</text>
<text class="ts" x="42" y="474">→ Đánh dấu diff_found = 1</text>
<text class="ts" x="42" y="496">Nếu trùng khớp hoàn toàn:</text>
<text class="ts" x="42" y="512">line_num++, tiếp tục vòng lặp</text>
</g>

<line x1="240" y1="448" x2="268" y2="448" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
<rect x="270" y="374" width="250" height="148" rx="8" stroke-width="0.5"/>
<text class="th" x="282" y="394">5.  Xử lý -q &amp; print_line()</text>
<text class="ts" x="282" y="416">Cờ -q (chế độ tóm tắt):</text>
<text class="th" x="282" y="432">→ in "diff: files differ", break</text>
<text class="ts" x="282" y="454">Mặc định (so sánh chi tiết):</text>
<text class="ts" x="282" y="472">print_line("&lt;", f1, line_num, …)</text>
<text class="ts" x="282" y="490">print_line("&gt;", f2, line_num, …)</text>
<text class="ts" x="282" y="510">thiếu '\n' → cảnh báo no newline</text>
</g>

<line x1="520" y1="448" x2="548" y2="448" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal">
<rect x="550" y="374" width="180" height="148" rx="8" stroke-width="0.5"/>
</g>
<circle cx="564" cy="388" r="3" fill="var(--t)"/><circle cx="575" cy="388" r="3" fill="var(--t)"/><circle cx="586" cy="388" r="3" fill="var(--t)"/>
<text class="mono" x="562" y="412">$ diff a.txt b.txt</text>
<text class="mono" x="562" y="432">a.txt:2: &lt; banana</text>
<text class="mono" x="562" y="450">b.txt:2: &gt; berry</text>
<text class="mono" x="562" y="474">a.txt:3: &lt; EOF</text>
<text class="mono" x="562" y="492">b.txt:3: &gt; cherry</text>
<text class="ts" x="562" y="514">cảnh báo: no newline</text>

<!-- loopback -->
<path d="M30 448 H16 V232 H28" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="11" y="340" text-anchor="middle" transform="rotate(-90 11 340)">lặp dòng kế: line_num++</text>

<!-- ============ (d) Kết thúc & Dọn dẹp ============ -->
<line x1="135" y1="522" x2="135" y2="544" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="30" y="546" width="260" height="26" rx="13" stroke-width="0.5"/>
<text class="ts" x="160" y="559" text-anchor="middle" dominant-baseline="central">free(buf1, buf2) · close(fd1, fd2)</text>

<line x1="290" y1="559" x2="328" y2="559" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="330" y="546" width="400" height="26" rx="13" stroke-width="0.5"/>
<text class="ts" x="530" y="559" text-anchor="middle" dominant-baseline="central">exit(0): khớp · exit(1): khác biệt · exit(2): lỗi</text>

<!-- ============ Legend ============ -->
<g class="c-purple"><rect x="30" y="602" width="16" height="16" rx="3" stroke-width="0.8"/></g>
<text class="ts" x="54" y="610" dominant-baseline="central">Bước xử lý</text>
<g class="c-teal"><rect x="170" y="602" width="16" height="16" rx="3" stroke-width="0.8"/></g>
<text class="ts" x="194" y="610" dominant-baseline="central">Dữ liệu / kết quả</text>
<rect class="box" x="350" y="602" width="16" height="16" rx="3" stroke-width="0.8" stroke-dasharray="3 2"/>
<text class="ts" x="374" y="610" dominant-baseline="central">Điều kiện / rẽ nhánh</text>
</svg>
<figcaption>Workflow của <code>diff.c</code> (xv6). So sánh theo vị trí dòng bằng <code>readline()</code> với bộ đệm tự co giãn trên heap; cờ <code>-q</code> ngắt sớm khi phát hiện sai khác; mặc định hiển thị nội dung hai dòng với tiền tố <code>&lt;</code> và <code>&gt;</code>, xử lý trường hợp lệch số dòng (EOF) và thiếu ký tự xuống dòng.</figcaption>
</figure>
</body>
</html>
