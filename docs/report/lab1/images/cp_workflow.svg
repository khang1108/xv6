<svg xmlns="http://www.w3.org/2000/svg" width="760" height="882"  viewBox="0 0 760 882" role="img" aria-labelledby="svg-title svg-description">
<title id="svg-title">Workflow của cp.c trong xv6</title>
<desc id="svg-description">cp kiểm tra đủ hai đường dẫn, mở nguồn đọc, kiểm tra nguồn và đích, chặn trường hợp cùng inode, mở file đích với O_TRUNC, sao chép dữ liệu theo buffer 512 byte và xử lý short write.</desc>
<defs>
<style>
text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
.t { font-size: 14px; fill: #2c2c2a; }
.ts { font-size: 12px; fill: #5f5e5a; }
.th { font-size: 14px; font-weight: 600; fill: #2c2c2a; }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace !important; font-size: 12px; fill: #2c2c2a; white-space: pre; }
.box { fill: #F1EFE8; stroke: #B4B2A9; }
.arr { stroke: #5f5e5a; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.kicker { font-size: 11px; font-weight: 600; letter-spacing: .07em; fill: #888780; }
.lane { fill: none; stroke: #B4B2A9; stroke-width: 1; stroke-dasharray: 4 4; }
.guide { stroke: #B4B2A9; stroke-width: 1; fill: none; stroke-dasharray: 4 4; }
.teal-arr { stroke: #0F6E56; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.c-purple > rect { fill: #EEEDFE; stroke: #534AB7; }
.c-purple > .th { fill: #3C3489; }
.c-purple > .ts { fill: #534AB7; }
.c-teal > rect, .c-teal > circle { fill: #E1F5EE; stroke: #0F6E56; }
.c-teal > .th { fill: #085041; }
.c-teal > .ts { fill: #0F6E56; }
</style>
</defs>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<symbol id="folder" viewBox="0 0 24 20"><path d="M1.5 3.5h8l2 2.5h11v12h-21z" fill="#F1EFE8" stroke="#5f5e5a" stroke-width="1.4" stroke-linejoin="round"/></symbol>
<symbol id="file" viewBox="0 0 18 22"><path d="M1.5 1.5h9l6 6v13h-15z M10.5 1.5v6h6" fill="#F1EFE8" stroke="#5f5e5a" stroke-width="1.4" stroke-linejoin="round"/></symbol>
</defs>
<rect class="box" x="30" y="44" width="190" height="89" rx="8" stroke-width=".7" />
<circle cx="43" cy="58" r="3" fill="#888780"/>
<circle cx="54" cy="58" r="3" fill="#888780"/>
<circle cx="65" cy="58" r="3" fill="#888780"/>
<text class="mono" x="42" y="85">$ cp src.txt dst.txt</text>
<text class="mono" x="42" y="102">sao chép 1 file</text><line x1="220" y1="88" x2="248" y2="88" class="arr" marker-end="url(#arrow)"/><g class="c-purple">
<rect class="box" x="250" y="44" width="250" height="89" rx="8" stroke-width=".7" />
<text class="th" x="262" y="66">main(args, argv)</text>
<text class="ts" x="262" y="86">args phải bằng 3</text>
<text class="ts" x="262" y="103">nếu sai → usage, exit(1)</text>
</g><line x1="500" y1="88" x2="528" y2="88" class="arr" marker-end="url(#arrow)"/><g class="c-purple">
<rect class="box" x="530" y="44" width="200" height="89" rx="8" stroke-width=".7" />
<text class="th" x="542" y="66">cp(src, dst)</text>
<text class="ts" x="542" y="86">copy rồi exit(0)</text>
<text class="ts" x="542" y="103">lỗi → exit(1)</text>
</g><path d="M628 133 V156 H160 V176" class="arr" marker-end="url(#arrow)"/><g class="c-purple">
<rect class="box" x="30" y="178" width="326" height="149" rx="8" stroke-width=".7" />
<text class="th" x="42" y="200">1.  Kiểm tra nguồn</text>
<text class="ts" x="42" y="220">open(src, O_RDONLY) → source</text>
<text class="ts" x="42" y="237">fstat(source, &amp;source_stat)</text>
<text class="ts" x="42" y="254">nguồn là thư mục (T_DIR) → lỗi</text>
<text class="ts" x="42" y="271">không mở / không stat được → lỗi</text>
</g><line x1="356" y1="248" x2="397" y2="248" class="arr" marker-end="url(#arrow)"/><g class="c-teal">
<rect class="box" x="399" y="178" width="331" height="149" rx="8" stroke-width=".7" />
<text class="th" x="411" y="200">2.  Kiểm tra đích</text>
<text class="ts" x="411" y="220">stat(dst): nếu tồn tại, xét type</text>
<text class="ts" x="411" y="237">T_DIR → lỗi</text>
<text class="ts" x="411" y="254">cùng dev và ino với nguồn → lỗi</text>
<text class="ts" x="411" y="271">chưa tồn tại → cho phép tạo mới</text>
</g><path d="M564 327 V349 H380 V369" class="arr" marker-end="url(#arrow)"/><g class="c-purple">
<rect class="box" x="179" y="371" width="402" height="120" rx="8" stroke-width=".7" />
<text class="th" x="191" y="393">3.  open(dst, flags)</text>
<text class="ts" x="191" y="413">O_WRONLY | O_CREATE | O_TRUNC</text>
<text class="ts" x="191" y="430">đích chưa có → tạo · đã có → xóa nội dung cũ</text>
<text class="ts" x="191" y="447">open thất bại → báo lỗi, đóng source, exit(1)</text>
</g><line x1="380" y1="491" x2="380" y2="514" class="arr" marker-end="url(#arrow)"/><g class="c-purple">
<rect class="box" x="30" y="516" width="317" height="133" rx="8" stroke-width=".7" />
<text class="th" x="42" y="538">4.  read(source, buffer, 512)</text>
<text class="ts" x="42" y="558">char buffer[512]</text>
<text class="ts" x="42" y="575">đọc đến 512 byte mỗi lượt</text>
<text class="ts" x="42" y="592">&gt; 0: có dữ liệu · 0: EOF</text>
<text class="ts" x="42" y="609">&lt; 0: báo lỗi và exit(1)</text>
</g><line x1="347" y1="581" x2="400" y2="581" class="arr" marker-end="url(#arrow)"/><g class="c-teal">
<rect class="box" x="402" y="516" width="328" height="133" rx="8" stroke-width=".7" />
<text class="th" x="414" y="538">5.  write(destination, …)</text>
<text class="ts" x="414" y="558">total_written = 0</text>
<text class="ts" x="414" y="575">while (total_written &lt; bytes_read)</text>
<text class="ts" x="414" y="592">ghi phần còn thiếu nếu short write</text>
<text class="ts" x="414" y="609">write &lt;= 0 → báo lỗi, exit(1)</text>
</g><line x1="402" y1="629" x2="348" y2="629" class="arr" marker-end="url(#arrow)"/><text class="ts" x="375" y="622" text-anchor="middle">lặp</text><path d="M190 649 V675 H560 V692" class="arr" marker-end="url(#arrow)"/><text class="ts" x="376" y="666" text-anchor="middle">EOF / lỗi</text><g class="c-teal">
<rect class="box" x="30" y="694" width="333" height="129" rx="8" stroke-width=".7" />
<text class="th" x="42" y="716">Dữ liệu chảy qua buffer 512 B</text>
<text class="ts" x="42" y="736">Ví dụ file 1100 B: 512 + 512 + 76</text>
<text class="ts" x="42" y="753">mỗi lượt đọc có thể trả ít hơn 512</text>
<text class="ts" x="42" y="770">lệnh write có thể ghi không đủ</text>
<text class="ts" x="42" y="787">→ lặp đến hết bytes_read</text>
</g><g class="c-purple">
<rect class="box" x="396" y="694" width="334" height="129" rx="8" stroke-width=".7" />
<text class="th" x="408" y="716">6.  Dọn dẹp &amp; kết thúc</text>
<text class="ts" x="408" y="736">đọc xong (EOF) → close(source)</text>
<text class="ts" x="408" y="753">close(destination) · exit(0)</text>
<text class="ts" x="408" y="770">nếu read &lt; 0 → đóng 2 fd, exit(1)</text>
<text class="ts" x="408" y="787">không phải sao chép thư mục</text>
</g><rect class="box" x="30" y="848" width="16" height="16" rx="3" stroke-width=".8" style="fill:#EEEDFE;stroke:#534AB7"/>
<text class="ts" x="54" y="857" dominant-baseline="central">Bước xử lý</text>
<rect class="box" x="174" y="848" width="16" height="16" rx="3" stroke-width=".8" style="fill:#E1F5EE;stroke:#0F6E56"/>
<text class="ts" x="198" y="857" dominant-baseline="central">Dữ liệu / kết quả</text>
<rect class="box" x="370" y="848" width="16" height="16" rx="3" stroke-width=".8" stroke-dasharray="3 2"/>
<text class="ts" x="394" y="857" dominant-baseline="central">Điều kiện / ghi chú</text>
</svg>