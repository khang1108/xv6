<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workflow của du.c trong xv6</title>
<style>
:root{
  --bg:#ffffff; --p:#2c2c2a; --s:#5f5e5a; --t:#888780;
  --surface:#F1EFE8; --border:#B4B2A9;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1c1c1a; --p:#F1EFE8; --s:#B4B2A9; --t:#888780; --surface:#2c2c2a; --border:#5F5E5A; }
}
html,body{margin:0;background:var(--bg);}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--p);padding:24px 16px;}
figure{max-width:960px;margin:0 auto;}
svg{width:100%;height:auto;display:block;}
figcaption{font-size:14px;color:var(--s);margin-top:12px;line-height:1.6;}
svg text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
.t{font-size:14px;fill:var(--p);}
.ts{font-size:12px;fill:var(--s);}
.th{font-size:14px;font-weight:500;fill:var(--p);}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace !important;font-size:12px;fill:var(--p);white-space:pre;}
.box{fill:var(--surface);stroke:var(--border);}
.arr{stroke:var(--s);stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round;}

.c-purple > rect{fill:#EEEDFE;stroke:#534AB7;}
.c-purple > .th{fill:#3C3489;}
.c-purple > .ts{fill:#534AB7;}
.c-teal > rect,.c-teal > circle{fill:#E1F5EE;stroke:#0F6E56;}
.c-teal > .th{fill:#085041;}
.c-teal > .ts{fill:#0F6E56;}
@media (prefers-color-scheme: dark){
  .c-purple > rect{fill:#3C3489;stroke:#AFA9EC;}
  .c-purple > .th{fill:#CECBF6;}
  .c-purple > .ts{fill:#AFA9EC;}
  .c-teal > rect,.c-teal > circle{fill:#085041;stroke:#5DCAA5;}
  .c-teal > .th{fill:#9FE1CB;}
  .c-teal > .ts{fill:#5DCAA5;}
}

/* Giữ nguyên hệ màu và typography từ template; bổ sung swimlane, nhãn. */
.kicker{font-size:11px;font-weight:600;letter-spacing:.07em;fill:var(--t);}
.lane{fill:none;stroke:var(--border);stroke-width:1;stroke-dasharray:4 4;}
.guide{stroke:var(--border);stroke-width:1;fill:none;stroke-dasharray:4 4;}
.teal-arr{stroke:#0F6E56;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
@media (prefers-color-scheme: dark){.teal-arr{stroke:#5DCAA5;}}
</style>
</head>
<body>
<figure>
<svg viewBox="0 0 760 860" role="img" aria-labelledby="svg-title svg-description">
<title id="svg-title">Workflow của du.c trong xv6</title>
<desc id="svg-description">main đọc path và cờ -a, -s; hàm du đệ quy theo loại đối tượng, lưu các mục trong mảng động, đóng file descriptor sớm, cộng tổng dung lượng từ dưới lên và in theo cờ.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<symbol id="folder" viewBox="0 0 24 20"><path d="M1.5 3.5h8l2 2.5h11v12h-21z" fill="var(--surface)" stroke="var(--s)" stroke-width="1.4" stroke-linejoin="round"/></symbol>
<symbol id="file" viewBox="0 0 18 22"><path d="M1.5 1.5h9l6 6v13h-15z M10.5 1.5v6h6" fill="var(--surface)" stroke="var(--s)" stroke-width="1.4" stroke-linejoin="round"/></symbol>
</defs>
<rect class="box" x="30" y="44" width="190" height="87" rx="8" stroke-width=".7" />
<circle cx="43" cy="58" r="3" fill="var(--t)"/>
<circle cx="54" cy="58" r="3" fill="var(--t)"/>
<circle cx="65" cy="58" r="3" fill="var(--t)"/>
<text class="mono" x="42" y="85">$ du docs -a</text>
<text class="mono" x="42" y="102">path=docs · a=1 · s=0</text><line x1="220" y1="88" x2="248" y2="88" class="arr" marker-end="url(#arrow)"/><g class="c-purple">
<rect class="box" x="250" y="44" width="250" height="87" rx="8" stroke-width=".7" />
<text class="th" x="262" y="66">main() phân tích argv</text>
<text class="ts" x="262" y="86">[path] · -a · -s (mọi thứ tự)</text>
<text class="ts" x="262" y="103">mặc định: path=&quot;.&quot;, a=s=0</text>
</g><line x1="500" y1="88" x2="528" y2="88" class="arr" marker-end="url(#arrow)"/><g class="c-purple">
<rect class="box" x="530" y="44" width="200" height="87" rx="8" stroke-width=".7" />
<text class="th" x="542" y="66">du(path, a, s, 1)</text>
<text class="ts" x="542" y="86">is_root = 1</text>
<text class="ts" x="542" y="103">đệ quy trả về số byte</text>
</g><path d="M630 131 V153 H115 V168" class="arr" marker-end="url(#arrow)"/><text class="ts" x="712" y="165" text-anchor="end">Mỗi lần gọi xử lý một path</text><g class="c-purple">
<rect class="box" x="30" y="170" width="164" height="108" rx="8" stroke-width=".7" />
<text class="th" x="42" y="192">1.  stat(path)</text>
<text class="ts" x="42" y="212">lấy type, size</text>
<text class="ts" x="42" y="229">stat lỗi → báo lỗi</text>
<text class="ts" x="42" y="246">và return 0</text>
</g><line x1="194" y1="225" x2="198" y2="225" class="arr" marker-end="url(#arrow)"/><polygon points="240,187 280,225 240,263 200,225" class="box" stroke-width=".8" stroke-linejoin="round"/><text class="ts" x="240" y="225" text-anchor="middle" dominant-baseline="central">type?</text><line x1="280" y1="225" x2="321" y2="225" class="arr" marker-end="url(#arrow)"/><text class="ts" x="300" y="211" text-anchor="middle">FILE</text><g class="c-teal">
<rect class="box" x="325" y="170" width="405" height="108" rx="8" stroke-width=".7" />
<text class="th" x="337" y="192">Nhánh FILE / DEVICE</text>
<text class="ts" x="337" y="212">Nếu is_root: luôn in size + path</text>
<text class="ts" x="337" y="229">Nếu !is_root: chỉ in khi a &amp;&amp; !s</text>
<text class="ts" x="337" y="246">Sau đó return st.size (không mở thư mục)</text>
</g><path d="M240 263 V301 H135 V324" class="arr" marker-end="url(#arrow)"/><text class="ts" x="248" y="293">T_DIR</text><g class="c-purple">
<rect class="box" x="30" y="326" width="208" height="126" rx="8" stroke-width=".7" />
<text class="th" x="42" y="348">2.  open() + read()</text>
<text class="ts" x="42" y="368">open(path, 0)</text>
<text class="ts" x="42" y="385">bỏ inum = 0, &quot;.&quot;, &quot;..&quot;</text>
<text class="ts" x="42" y="402">đọc từng struct dirent</text>
<text class="ts" x="42" y="419">lấy tên có kích thước DIRSIZ</text>
</g><line x1="238" y1="389" x2="264" y2="389" class="arr" marker-end="url(#arrow)"/><g class="c-teal">
<rect class="box" x="266" y="326" width="232" height="126" rx="8" stroke-width=".7" />
<text class="th" x="278" y="348">3.  names[] động</text>
<text class="ts" x="278" y="368">malloc ban đầu: 16 tên</text>
<text class="ts" x="278" y="385">khi đầy → capacity × 2</text>
<text class="ts" x="278" y="402">memmove tên, thêm byte NUL</text>
<text class="ts" x="278" y="419">count tăng sau mỗi tên</text>
</g><line x1="498" y1="389" x2="524" y2="389" class="arr" marker-end="url(#arrow)"/><g class="c-purple">
<rect class="box" x="526" y="326" width="204" height="126" rx="8" stroke-width=".7" />
<text class="th" x="538" y="348">4.  close(fd) sớm</text>
<text class="ts" x="538" y="368">đã lưu toàn bộ tên</text>
<text class="ts" x="538" y="385">giải phóng descriptor</text>
<text class="ts" x="538" y="402">trước khi đệ quy</text>
</g><path d="M628 452 V474 H180 V495" class="arr" marker-end="url(#arrow)"/><g class="c-purple">
<rect class="box" x="30" y="497" width="322" height="141" rx="8" stroke-width=".7" />
<text class="th" x="42" y="519">5.  Lặp i = 0 … count - 1</text>
<text class="ts" x="42" y="539">ghép buf = path + &quot;/&quot; + names[i]</text>
<text class="ts" x="42" y="556">quá MAXPATH → bỏ qua mục đó</text>
<text class="ts" x="42" y="573">total_size += du(buf, a, s, 0)</text>
<text class="ts" x="42" y="590">đệ quy hết nhánh rồi mới cộng</text>
</g><line x1="352" y1="564" x2="396" y2="564" class="arr" marker-end="url(#arrow)"/><g class="c-teal">
<rect class="box" x="398" y="497" width="332" height="141" rx="8" stroke-width=".7" />
<text class="th" x="410" y="519">6.  Tổng hợp &amp; in kết quả</text>
<text class="ts" x="410" y="539">free(names) sau khi duyệt xong</text>
<text class="ts" x="410" y="556">is_root: luôn in tổng dung lượng</text>
<text class="ts" x="410" y="573">không phải gốc: in khi !s</text>
<text class="ts" x="410" y="590">return total_size (byte, không cộng inode thư mục)</text>
</g><path d="M48 606 H18 V225 H28" class="arr" marker-end="url(#arrow)"/><text class="ts" x="28" y="490" text-anchor="middle" transform="rotate(-90 28 490)">đệ quy</text><text class="kicker" x="30" y="670">VÍ DỤ KẾT QUẢ (GIẢ ĐỊNH)</text><rect class="box" x="30" y="684" width="346" height="113" rx="8" stroke-width=".7" />
<circle cx="43" cy="698" r="3" fill="var(--t)"/>
<circle cx="54" cy="698" r="3" fill="var(--t)"/>
<circle cx="65" cy="698" r="3" fill="var(--t)"/>
<text class="mono" x="42" y="725">$ du docs</text>
<text class="mono" x="42" y="742">80     docs/logs</text>
<text class="mono" x="42" y="759">200    docs</text><g class="c-teal">
<rect class="box" x="398" y="684" width="332" height="113" rx="8" stroke-width=".7" />
<text class="th" x="410" y="706">Cách cờ ảnh hưởng đầu ra</text>
<text class="ts" x="410" y="726">-a: in thêm các file con</text>
<text class="ts" x="410" y="743">-s: chỉ in tổng thư mục gốc</text>
<text class="ts" x="410" y="760">-a -s: -s vẫn ẩn các mục con</text>
</g><rect class="box" x="30" y="824" width="16" height="16" rx="3" stroke-width=".8" style="fill:#EEEDFE;stroke:#534AB7"/>
<text class="ts" x="54" y="833" dominant-baseline="central">Bước xử lý</text>
<rect class="box" x="174" y="824" width="16" height="16" rx="3" stroke-width=".8" style="fill:#E1F5EE;stroke:#0F6E56"/>
<text class="ts" x="198" y="833" dominant-baseline="central">Dữ liệu / kết quả</text>
<rect class="box" x="370" y="824" width="16" height="16" rx="3" stroke-width=".8" stroke-dasharray="3 2"/>
<text class="ts" x="394" y="833" dominant-baseline="central">Điều kiện / ghi chú</text>
</svg>
<figcaption>Workflow của <code>du.c</code> (xv6). Thu thập tên mục trong thư mục, đóng <code>fd</code> trước khi duyệt đệ quy, cộng dung lượng kiểu <strong>bottom-up</strong>; <code>-a</code> in thêm file, <code>-s</code> chỉ giữ đầu ra của gốc. Ví dụ đầu ra dùng dữ liệu giả định.</figcaption>
</figure>
</body>
</html>
