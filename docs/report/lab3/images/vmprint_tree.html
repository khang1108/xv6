<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sv39 Page Table Hierarchy of init (vmprint)</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">TREE · LAB 03 PAGE TABLE</p>
    <h1>Sv39 Page Table Hierarchy of init (vmprint)</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vmprint-tree-title vmprint-tree-desc">
        <title id="vmprint-tree-title">Sv39 Page Table Hierarchy of init (vmprint)</title>
        <desc id="vmprint-tree-desc">Tree diagram showing the three-level Sv39 page table structure of process init printed by vmprintwalk() down to low and high leaf PTEs.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Tier Labels (left margin) -->
        <text x="40" y="100" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">ROOT · L2</text>
        <text x="40" y="220" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">DEPTH 1 · L2</text>
        <text x="40" y="340" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">DEPTH 2 · L1</text>
        <text x="40" y="500" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">DEPTH 3 · L0</text>

        <!-- Connectors drawn first (orthogonal elbow buses) -->
        <!-- Root (640,124) -> L2 Entry 0 (360,192) & L2 Entry 255 (920,192) -->
        <path d="M 640,124 V 148 Q 640,156 632,156 H 368 Q 360,156 360,164 V 192"
              fill="none" stroke="#4f5d75" stroke-width="1"/>
        <path d="M 640,156 H 912 Q 920,156 920,164 V 192"
              fill="none" stroke="#4f5d75" stroke-width="1"/>

        <!-- L2 Entry 0 (360,244) -> L1 Entry 0 (360,312) -->
        <line x1="360" y1="244" x2="360" y2="312" stroke="#4f5d75" stroke-width="1"/>

        <!-- L2 Entry 255 (920,244) -> L1 Entry 511 (920,312) -->
        <line x1="920" y1="244" x2="920" y2="312" stroke="#4f5d75" stroke-width="1"/>

        <!-- L1 Entry 0 (360,364) -> Leaf 0-1 (248,464) & Leaf 2-4 (504,464) -->
        <path d="M 360,364 V 404 Q 360,412 352,412 H 256 Q 248,412 248,420 V 464"
              fill="none" stroke="#4f5d75" stroke-width="1"/>
        <path d="M 360,412 H 496 Q 504,412 504,420 V 464"
              fill="none" stroke="#4f5d75" stroke-width="1"/>

        <!-- L1 Entry 511 (920,364) -> Leaf 509 (800,464) & Leaf 510-511 (1064,464) -->
        <path d="M 920,364 V 404 Q 920,412 912,412 H 808 Q 800,412 800,420 V 464"
              fill="none" stroke="#4f5d75" stroke-width="1"/>
        <path d="M 920,412 H 1056 Q 1064,412 1064,420 V 464"
              fill="none" stroke="#4f5d75" stroke-width="1"/>

        <!-- Tier 0: Root (only coral focal node) -->
        <rect x="536" y="72" width="208" height="52" rx="6" fill="#f5f5f5"/>
        <rect x="536" y="72" width="208" height="52" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="544" y="78" width="36" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="562" y="87" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">ROOT</text>
        <text x="640" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">p-&gt;pagetable</text>
        <text x="640" y="116" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">pa 0x87f4d000 · depth 1</text>

        <!-- Tier 1: L2 Entries -->
        <rect x="256" y="192" width="208" height="52" rx="6" fill="#f5f5f5"/>
        <rect x="256" y="192" width="208" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="264" y="198" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="278" y="207" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">..0</text>
        <text x="360" y="222" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">L2 Entry 0</text>
        <text x="360" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">flags 0x01 · low VA</text>

        <rect x="816" y="192" width="208" height="52" rx="6" fill="#f5f5f5"/>
        <rect x="816" y="192" width="208" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="824" y="198" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="844" y="207" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">..255</text>
        <text x="920" y="222" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">L2 Entry 255</text>
        <text x="920" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">flags 0x01 · high VA</text>

        <!-- Tier 2: L1 Entries -->
        <rect x="256" y="312" width="208" height="52" rx="6" fill="#f5f5f5"/>
        <rect x="256" y="312" width="208" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="264" y="318" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="286" y="327" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">.. ..0</text>
        <text x="360" y="342" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">L1 Entry 0</text>
        <text x="360" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">pa 0x87f48000 · R=W=X=0</text>

        <rect x="816" y="312" width="208" height="52" rx="6" fill="#f5f5f5"/>
        <rect x="816" y="312" width="208" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="824" y="318" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="852" y="327" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">.. ..511</text>
        <text x="920" y="342" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">L1 Entry 511</text>
        <text x="920" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">pa 0x87f4b000 · R=W=X=0</text>

        <!-- Tier 3: Leaf PTEs (thinner 0.8 stroke) -->
        <rect x="140" y="464" width="216" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="140" y="464" width="216" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="148" y="472" width="56" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="176" y="481" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">LEAF 0-1</text>
        <text x="248" y="500" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">Text &amp; Data/BSS</text>
        <text x="248" y="516" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">0x1B (VRXU) · 0x17 (VRWU)</text>

        <rect x="396" y="464" width="216" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="396" y="464" width="216" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="404" y="472" width="56" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="432" y="481" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">LEAF 2-4</text>
        <text x="504" y="500" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">Guard &amp; User Stack</text>
        <text x="504" y="516" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">0x07 (no U) · 0x17 (VRWU)</text>

        <rect x="692" y="464" width="216" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="692" y="464" width="216" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="0.8"/>
        <rect x="700" y="472" width="56" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="728" y="481" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">LEAF 509</text>
        <text x="800" y="500" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">USYSCALL</text>
        <text x="800" y="516" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">0x13 (VRU) · read-only PID</text>

        <rect x="956" y="464" width="216" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="956" y="464" width="216" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="964" y="472" width="76" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="1002" y="481" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">LEAF 510-511</text>
        <text x="1064" y="500" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">Trapframe &amp; Trampoline</text>
        <text x="1064" y="516" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">0x07 (VRW) · 0x0B (VRX)</text>

        <!-- Horizontal Legend Strip -->
        <line x1="48" y1="628" x2="1232" y2="628" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <text x="48" y="648" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              letter-spacing="0.14em">LEGEND</text>

        <rect x="136" y="638" width="16" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="160" y="648" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Root pagetable (L2)</text>

        <rect x="336" y="638" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="360" y="648" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Internal PTE (R=W=X=0, recurse)</text>

        <rect x="616" y="638" width="16" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="640" y="648" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Leaf PTE (R/W/X != 0, stop)</text>

        <rect x="880" y="638" width="16" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="0.8"/>
        <text x="904" y="648" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">USYSCALL leaf (0x13 = V|R|U)</text>
      </svg>
    </div>
  </div>
</body>
</html>
