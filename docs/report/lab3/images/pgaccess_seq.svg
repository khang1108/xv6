<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pgaccess-seq-title pgaccess-seq-desc" id="pgaccess_seq-root">
        <title id="pgaccess-seq-title">Page Access Detection Lifecycle (pgaccess &amp; PTE_A)</title>
        <desc id="pgaccess-seq-desc">Sequence diagram showing the RISC-V MMU setting PTE_A on page access and sys_pgaccess() walking leaf PTEs in a loop to build and copy out the bitmask while clearing PTE_A.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #pgaccess_seq-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #pgaccess_seq-root { font-family: var(--font-sans); color: var(--color-ink); }
      #pgaccess_seq-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#pgaccess_seq-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="pgaccess_seq-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="pgaccess_seq-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="pgaccess_seq-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Lifelines (x = 160, 480, 800, 1120) -->
        <line x1="160" y1="128" x2="160" y2="588" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
        <line x1="480" y1="128" x2="480" y2="588" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
        <line x1="800" y1="128" x2="800" y2="588" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
        <line x1="1120" y1="128" x2="1120" y2="588" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>

        <!-- Combined Fragment: LOOP -->
        <rect x="672" y="296" width="472" height="168" rx="4"
              fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.02" stroke-opacity="0.22"/>
        <rect x="672" y="296" width="44" height="16" rx="2"
              fill="#f5f5f5" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <text x="694" y="307" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.12em">LOOP</text>
        <text x="684" y="328" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              letter-spacing="0.04em">[for i = 0 .. len-1]</text>

        <!-- Activation Bars (w=8) -->
        <rect x="476" y="164" width="8" height="56" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>
        <rect x="796" y="256" width="8" height="280" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>
        <rect x="1116" y="348" width="8" height="104" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>

        <!-- Message Arrows (time flows top -> down, drawn before masks) -->
        <!-- M1: User -> MMU -->
        <line x1="160" y1="168" x2="476" y2="168" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#pgaccess_seq-arrow-link)"/>
        <!-- M2: MMU -> Leaf PTEs -->
        <line x1="484" y1="212" x2="1120" y2="212" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pgaccess_seq-arrow)"/>
        <!-- M3: User -> sys_pgaccess() -->
        <line x1="160" y1="260" x2="796" y2="260" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#pgaccess_seq-arrow-link)"/>
        <!-- M4: sys_pgaccess() -> Leaf PTEs (walk) -->
        <line x1="804" y1="356" x2="1116" y2="356" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pgaccess_seq-arrow)"/>
        <!-- M5: Leaf PTEs -> sys_pgaccess() (return flags) -->
        <line x1="1116" y1="400" x2="804" y2="400" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#pgaccess_seq-arrow)"/>
        <!-- M6: sys_pgaccess() -> Leaf PTEs (clear PTE_A) -->
        <line x1="804" y1="444" x2="1116" y2="444" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pgaccess_seq-arrow)"/>
        <!-- M7: sys_pgaccess() -> User (copyout mask - headline success coral) -->
        <line x1="796" y1="528" x2="160" y2="528" stroke="#bf4520" stroke-width="1.4" marker-end="url(#pgaccess_seq-arrow-accent)"/>

        <!-- Message Labels (opaque paper masks, 8px above strokes, clear of lifelines) -->
        <rect x="268" y="148" width="104" height="12" rx="2" fill="#f5f5f5"/>
        <text x="320" y="157" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">TOUCH PAGE VA</text>

        <rect x="592" y="192" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="201" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">SET PTE_A = 1</text>

        <rect x="268" y="240" width="104" height="12" rx="2" fill="#f5f5f5"/>
        <text x="320" y="249" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">ECALL PGACCESS</text>

        <rect x="916" y="336" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="960" y="345" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">WALK(VA, 0)</text>

        <rect x="912" y="380" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="960" y="389" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">PTE_V &amp; PTE_A</text>

        <rect x="912" y="424" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="960" y="433" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">CLEAR ~PTE_A</text>

        <rect x="272" y="508" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="320" y="517" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">COPYOUT MASK</text>

        <!-- Actor Boxes (top row y=72, h=56, w=208) -->
        <rect x="56" y="72" width="208" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="56" y="72" width="208" height="56" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <rect x="64" y="78" width="36" height="12" rx="2" fill="none" stroke="#5a6580" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="82" y="87" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">USER</text>
        <text x="160" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">User Process</text>
        <text x="160" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">pgtbltest · buf[32*PGSIZE]</text>

        <rect x="376" y="72" width="208" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="376" y="72" width="208" height="56" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="384" y="78" width="28" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="398" y="87" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">HW</text>
        <text x="480" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">RISC-V MMU</text>
        <text x="480" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">TLB &amp; Sv39 page walker</text>

        <rect x="696" y="72" width="208" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="696" y="72" width="208" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="704" y="78" width="44" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="726" y="87" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">KERNEL</text>
        <text x="800" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">sys_pgaccess()</text>
        <text x="800" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">sysproc.c · SYS_pgaccess=25</text>

        <rect x="1016" y="72" width="208" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="1016" y="72" width="208" height="56" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="1024" y="78" width="28" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="1038" y="87" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">RAM</text>
        <text x="1120" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">Leaf PTEs</text>
        <text x="1120" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">p-&gt;pagetable · PTE_A (bit 6)</text>

        <!-- Horizontal Legend Strip -->
        <line x1="56" y1="620" x2="1224" y2="620" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
        <text x="56" y="640" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              letter-spacing="0.14em">LEGEND</text>

        <line x1="144" y1="636" x2="176" y2="636" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#pgaccess_seq-arrow-link)"/>
        <text x="184" y="640" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">User memory touch / syscall</text>

        <line x1="424" y1="636" x2="456" y2="636" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pgaccess_seq-arrow)"/>
        <text x="464" y="640" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Hardware / kernel PTE update</text>

        <line x1="704" y1="636" x2="736" y2="636" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#pgaccess_seq-arrow)"/>
        <text x="744" y="640" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Return PTE flags</text>

        <line x1="904" y1="636" x2="936" y2="636" stroke="#bf4520" stroke-width="1.4" marker-end="url(#pgaccess_seq-arrow-accent)"/>
        <text x="944" y="640" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">copyout() bitmask to user</text>
      </svg>
