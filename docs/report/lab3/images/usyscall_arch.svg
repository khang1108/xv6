<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="usyscall-arch-title usyscall-arch-desc" id="usyscall_arch-root">
        <title id="usyscall-arch-title">USYSCALL Read-Only Shared Page Architecture</title>
        <desc id="usyscall-arch-desc">Architecture comparing direct user-mode read from the USYSCALL page in ugetpid() against the ecall trap path in getpid() and kernel page lifecycle.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #usyscall_arch-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #usyscall_arch-root { font-family: var(--font-sans); color: var(--color-ink); }
      #usyscall_arch-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#usyscall_arch-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="usyscall_arch-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="usyscall_arch-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="usyscall_arch-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones (drawn before arrows and nodes) -->
        <rect x="48" y="96" width="320" height="496" rx="8"
              fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="128" y="100" width="160" height="12" rx="2" fill="#f5f5f5"/>
        <text x="208" y="109" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.14em">USER SPACE (U-MODE)</text>

        <rect x="432" y="96" width="384" height="496" rx="8"
              fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="524" y="100" width="200" height="12" rx="2" fill="#f5f5f5"/>
        <text x="624" y="109" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.14em">USER PAGETABLE · HIGH VA</text>

        <rect x="880" y="96" width="352" height="496" rx="8"
              fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="968" y="100" width="176" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1056" y="109" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.14em">KERNEL SPACE (S-MODE)</text>

        <!-- Connectors (drawn before nodes) -->
        <!-- 1. ugetpid() -> USYSCALL Page (coral headline fast path) -->
        <line x1="320" y1="196" x2="488" y2="196" stroke="#bf4520" stroke-width="1.2" marker-end="url(#usyscall_arch-arrow-accent)"/>

        <!-- 2. ugetpid() -> blocked write stop bar before boundary -->
        <line x1="320" y1="220" x2="468" y2="220" stroke="#bf4520" stroke-width="1" stroke-dasharray="4,3"/>
        <line x1="468" y1="212" x2="468" y2="228" stroke="#bf4520" stroke-width="2"/>

        <!-- 3. allocproc & mappages -> USYSCALL Page -->
        <line x1="920" y1="208" x2="760" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#usyscall_arch-arrow)"/>

        <!-- 4. uvmunmap & freeproc -> USYSCALL Page bottom edge (L-path, dashed) -->
        <path d="M 920,332 H 632 Q 624,332 624,324 V 240"
              fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#usyscall_arch-arrow)"/>

        <!-- 5. getpid() -> Trapframe & Trampoline -->
        <line x1="320" y1="456" x2="488" y2="456" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#usyscall_arch-arrow-link)"/>

        <!-- 6. Trapframe & Trampoline -> usertrap & sys_getpid -->
        <line x1="760" y1="456" x2="920" y2="456" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#usyscall_arch-arrow)"/>

        <!-- Arrow labels (opaque mask + 6-10px gap from stroke) -->
        <rect x="364" y="176" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="404" y="185" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">LOAD U-&gt;PID</text>

        <rect x="348" y="228" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="396" y="237" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">WRITE BLOCKED</text>

        <rect x="796" y="188" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="840" y="197" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">MAP PTE_R|U</text>

        <rect x="736" y="312" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="784" y="321" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">UNMAP &amp; KFREE</text>

        <rect x="368" y="436" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="404" y="445" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">ECALL TRAP</text>

        <rect x="796" y="436" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="840" y="445" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">SATP SWITCH</text>

        <!-- Nodes (drawn after arrows) -->
        <!-- Node 1: ugetpid() -->
        <rect x="96" y="176" width="224" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="96" y="176" width="224" height="64" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <rect x="104" y="184" width="36" height="12" rx="2" fill="none" stroke="#5a6580" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="122" y="193" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">USER</text>
        <text x="208" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">ugetpid()</text>
        <text x="208" y="228" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">user/ulib.c · direct load</text>

        <!-- Node 2: getpid() -->
        <rect x="96" y="424" width="224" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="96" y="424" width="224" height="64" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <rect x="104" y="432" width="36" height="12" rx="2" fill="none" stroke="#5a6580" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="122" y="441" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">USER</text>
        <text x="208" y="460" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">getpid()</text>
        <text x="208" y="476" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">usys.S · ecall SYS_getpid</text>

        <!-- Node 3: USYSCALL Page (focal coral) -->
        <rect x="488" y="176" width="272" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="488" y="176" width="272" height="64" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <rect x="496" y="184" width="56" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="524" y="193" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">LEAF 509</text>
        <text x="624" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">USYSCALL Page</text>
        <text x="624" y="228" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">TRAPFRAME-PGSIZE · PTE_R|PTE_U</text>

        <!-- Node 4: Trapframe & Trampoline -->
        <rect x="488" y="424" width="272" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="488" y="424" width="272" height="64" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="496" y="432" width="76" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="534" y="441" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">LEAF 510-511</text>
        <text x="624" y="460" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">Trapframe &amp; Trampoline</text>
        <text x="624" y="476" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">PTE_U=0 · kernel context</text>

        <!-- Node 5: allocproc & mappages -->
        <rect x="920" y="176" width="272" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="920" y="176" width="272" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="928" y="184" width="36" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="946" y="193" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">INIT</text>
        <text x="1056" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">allocproc &amp; mappages</text>
        <text x="1056" y="228" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">kalloc() · pid write · map</text>

        <!-- Node 6: uvmunmap & freeproc (optional/exit dashed) -->
        <rect x="920" y="300" width="272" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="920" y="300" width="272" height="64" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.02" stroke-opacity="0.20"/>
        <rect x="928" y="308" width="36" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.35"/>
        <text x="946" y="317" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">EXIT</text>
        <text x="1056" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">uvmunmap &amp; freeproc</text>
        <text x="1056" y="352" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">do_free=0 · kfree(usyscall)</text>

        <!-- Node 7: usertrap & sys_getpid -->
        <rect x="920" y="424" width="272" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="920" y="424" width="272" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="928" y="432" width="36" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="946" y="441" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">TRAP</text>
        <text x="1056" y="460" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">usertrap &amp; sys_getpid</text>
        <text x="1056" y="476" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">satp switch · myproc()-&gt;pid</text>

        <!-- Horizontal Legend Strip -->
        <line x1="48" y1="640" x2="1232" y2="640" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
        <text x="48" y="660" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              letter-spacing="0.14em">LEGEND</text>

        <rect x="136" y="650" width="16" height="12" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="160" y="660" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Focal shared read-only page</text>

        <line x1="380" y1="656" x2="412" y2="656" stroke="#bf4520" stroke-width="1.2" marker-end="url(#usyscall_arch-arrow-accent)"/>
        <text x="420" y="660" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Direct U-mode read (no trap)</text>

        <line x1="652" y1="656" x2="684" y2="656" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#usyscall_arch-arrow-link)"/>
        <text x="692" y="660" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Syscall trap path (ecall)</text>

        <line x1="908" y1="656" x2="940" y2="656" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#usyscall_arch-arrow)"/>
        <text x="948" y="660" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Exit cleanup / blocked write</text>
      </svg>
